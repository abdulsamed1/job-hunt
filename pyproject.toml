[project]
name = "job-hunt-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abdulsamed1", email = "abdalsamed71@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.17.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
job-hunt-agent = "job_hunt_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
