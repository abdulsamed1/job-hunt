name: scheduled-sweep

on:
  schedule:
    # Daily full 198-source 24h-remote sweep (02:00 UTC; 176 dead boards skipped)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Live submission (default dry-run)"
        type: boolean
        default: false
      full:
        description: "Full 198-source sweep (LinkedIn sources are disabled)"
        type: boolean
        default: false

concurrency:
  group: jobhunt-pipeline
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      REZI_MCP_TOKEN: ${{ secrets.REZI_MCP_TOKEN }}
      # Lifecycle alerts from CI runs (web UI runs are intentionally silent;
      # configure the secrets to receive sweep notifications).
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Event allowlist (comma-separated). Unset = the default outcome set
      # (APPLICATION_ATTEMPT/SUBMITTED/DRY_RUN/FAILED/STAGE_FAILED); the stage
      # events stay silent. Same name and same rules as the Worker's var.
      TELEGRAM_EVENTS: ${{ vars.TELEGRAM_EVENTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Chromium for Playwright
        run: uv run python -m playwright install chromium --with-deps

      - name: Full sweep (24h, remote anywhere + Egypt)
        if: inputs.full == true || github.event_name == 'schedule'
        run: |
          uv run python -m job_hunt.cli scan --hours-old 24 --target-geo
          uv run python -m job_hunt.cli evaluate --limit 400 --no-llm
          uv run python -m job_hunt.cli tailor --limit 50 --no-llm

      - name: Application stage (dry-run unless approved live)
        run: |
          LIVE_FLAG=""
          if [ "${{ inputs.live }}" = "true" ]; then
            LIVE_FLAG="--live"
          fi
          uv run python -m job_hunt.cli apply --limit 10 $LIVE_FLAG

      - name: Upload tracker DB + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ github.run_number }}
          path: |
            data/jobs.db
            data/screenshots/
          retention-days: 14
