name = "jobhunt"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# 2 of the 5 free cron triggers used: hourly scout + 6-hourly deep sweep.
# The deep sweep runs 4×/day because a once-daily sweep under a 24h window
# can miss a posting made just before the sweep time; every 6h every dated
# posting is seen while still inside the window.
[triggers]
crons = ["15 * * * *", "0 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "jobhunt"
database_id = "85083fc7-13cc-4f52-b818-1e6f11b62562"

[[queues.producers]]
binding = "DISCOVER_Q"
queue = "jobhunt-discover"

[[queues.producers]]
binding = "EVALUATE_Q"
queue = "jobhunt-evaluate"

[[queues.producers]]
binding = "APPLY_Q"
queue = "jobhunt-apply"

[[queues.consumers]]
queue = "jobhunt-discover"
# One source per invocation: a message stores up to INTAKE_CAP postings and
# sends one evaluate message per new posting, so the per-invocation binding
# budget is cap × batch. 150 × 1 stays far under the subrequest ceiling;
# 150 × 10 (the default batch) does not.
max_batch_size = 1
max_retries = 2

[[queues.consumers]]
queue = "jobhunt-evaluate"
max_batch_size = 20
max_retries = 2

[[queues.consumers]]
queue = "jobhunt-apply"
max_batch_size = 5
max_retries = 1

[[r2_buckets]]
binding = "CV_BUCKET"
bucket_name = "jobhunt-cvs"

[vars]
QUERIES = "backend,fullstack,software"
TPR_SECONDS = "43200"
# Flood guard per source per run (not a throttle): 150 is above what a healthy
# board publishes in the 24h window, so every posting is normally kept.
INTAKE_CAP = "150"
THRESHOLD = "70"
# Safety defaults: everything is dry-run unless a human flips these.
# LinkedIn DISCOVERY is on (guest endpoints, no account). Applying through the
# owner's LinkedIn account stays off by design: the tailor-apply stage queues a
# LinkedIn row for the human and never calls an ATS client.
LINKEDIN_ENABLED = "true"
LIVE_APPLY = "false"
APPROVE_GREENHOUSE = "false"
APPROVE_LEVER = "false"
# Role gate: reject Salesforce/CRM implementation roles. "false" admits them.
REJECT_CRM_ROLES = "true"
# Telegram event allowlist (comma-separated). Default: the outcome events only
# (the stage events SEEKING/FILTERED/ELIGIBLE/TAILORED stay silent).
TELEGRAM_EVENTS = "APPLICATION_ATTEMPT,SUBMITTED,DRY_RUN,FAILED,STAGE_FAILED"
# Secrets (never commit): PROFILE_JSON, MASTER_RESUME_SHA,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, TELEGRAM_WEBHOOK_SECRET.
# Set with: npx wrangler secret put <NAME>
